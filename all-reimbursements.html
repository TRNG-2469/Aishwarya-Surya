<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Reimbursements</title>
    <link rel="stylesheet" href="style.css">
    <script src="all-reimbursements.js" defer></script>
</head>
<body>

<nav class="navbar">
    <div class="nav-left">
        <button id="backBtn">Back to My Reimbursements</button>
    </div>
    <h1>All Reimbursements</h1>
    <div class="nav-right">
        <button id="logoutBtn">Logout</button>
    </div>
</nav>

<p id="welcomeMsg"></p>

<div>
    <label for="statusFilter">Status:</label>
    <select id="statusFilter">
        <option value="">All</option>
        <option value="PENDING">Pending</option>
        <option value="APPROVED">Approved</option>
        <option value="DENIED">Denied</option>
    </select>

    <label for="departmentFilter">Department:</label>
    <input
            type="text"
            id="departmentFilter"
            placeholder="e.g. Sales"
    >

    <button id="filterBtn">Apply Filters</button>
    <button id="clearFilterBtn">Clear Filters</button>
</div>

<div id="reimbursementList"></div>

</body>
</html>
